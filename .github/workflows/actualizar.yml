name: Actualización Diaria de Ofertas

on:
  schedule:
    # Se ejecuta diariamente a las 08:00 UTC (09:00/10:00 hora de España/Portugal según horario de verano)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite ejecutar la tarea manualmente desde la web de GitHub

permissions:
  contents: write # Otorga permisos para modificar y subir ofertas.json al repositorio

jobs:
  actualizar-ofertas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar script de actualización
        run: python actualizar_ofertas.py

      - name: Commitear y guardar ofertas.json actualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ofertas.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: actualización automática de ofertas" && git push)
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      -  name: Instalar dependencias
         run: |
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar script
        run: python actualizar_ofertas.py

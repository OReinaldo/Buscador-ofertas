name: Actualización Diaria de ofertas

on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-ofertas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar script de actualización
        run: python actualizar_ofertas.py

      - name: Commitear y guardar ofertas.json actualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ofertas.json
          git diff --staged --quiet || (git commit -m "bot: actualización de ofertas.json [skip ci]" && git push)
